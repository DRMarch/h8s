apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endurain-oidc-client-secret
  namespace: endurain
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: endurain-oidc-client-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret-plaintext
      remoteRef:
        key: authelia/endurain-oidc
        property: client-secret-plaintext
