apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-admin-credentials
  namespace: grimmory
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: grimmory-admin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: grimmory/admin-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: grimmory/admin-credentials
        property: password
