# OIDC client secret, consumed by the bootstrap-oidc PostSync job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-oidc
  namespace: grimmory
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: grimmory-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: grimmory/oidc
        property: client-secret-plaintext
