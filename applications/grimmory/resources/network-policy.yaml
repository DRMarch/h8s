apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grimmory-mariadb-ingress
  namespace: grimmory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 3306
          protocol: TCP
