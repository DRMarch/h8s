apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-watch
  namespace: model-watch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: model-watch
              image: ghcr.io/drmarch/model-watch:f819fd0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
              env:
                - name: OPENAI_BASE_URL
                  value: "http://higress-internal.higress-system.svc.cluster.local"
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: model-watch-secrets
                      key: OPENAI_API_KEY
                - name: WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: model-watch-secrets
                      key: WEBHOOK_URL
                - name: NOTIFY_TYPE
                  value: "discord"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: model-watch-data
