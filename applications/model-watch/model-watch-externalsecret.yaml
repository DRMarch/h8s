apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-watch-secrets
  namespace: model-watch
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: model-watch-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: higress/api-keys/model-watch
        property: api-key
    - secretKey: WEBHOOK_URL
      remoteRef:
        key: model-watch/webhook-url
        property: url
