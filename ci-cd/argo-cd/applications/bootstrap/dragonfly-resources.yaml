apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dragonfly-resources
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DRMarch/h8s.git
    targetRevision: HEAD
    path: storage/dragonfly/resources
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
