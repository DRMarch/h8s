apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: https://github.com/DRMarch/h8s.git
      targetRevision: HEAD
      path: applications/memory-service/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: memory-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
      - CreateNamespace=true
