apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-secrets-dashboard
  namespace: monitoring
spec:
  folderRef: external-secrets
  grafanaCom:
    id: 21640
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasources:
    - inputName: "DS_METRICS"
      datasourceName: "prom-default"
