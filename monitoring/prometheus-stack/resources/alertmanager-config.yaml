apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: discord
  namespace: monitoring
spec:
  route:
    groupBy: ['namespace', 'severity']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    receiver: discord
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            matchType: =~
            value: InfoInhibitor|Watchdog
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: url
          sendResolved: true
    # Receiver without integrations: alerts routed here are dropped.
    - name: blackhole
