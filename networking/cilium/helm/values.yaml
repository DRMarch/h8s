# https://artifacthub.io/packages/helm/cilium/cilium/1.20.0-pre.4?modal=values
operator:
  enabled: true
  replicas: 1

l2announcements:
  enabled: true

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

kubeProxyReplacement: true

# Pin explicitly: chart 1.20.4 omits this key by default, but a stale
# `envoy-xds-mode: ads` left in cilium-config breaks the agent<->envoy xDS
# handshake (envoy requests split CDS/LDS, agent only serves ADS).
envoy:
  xdsMode: split

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
