apiVersion: batch/v1
kind: CronJob
metadata:
  name: blocklist-updater
  namespace: coredns-lan
spec:
  # Runs daily at 2 AM
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: blocklist-storage
              persistentVolumeClaim:
                claimName: coredns-blocklist
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
          containers:
            - name: updater
              image: curlimages/curl
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - /bin/sh
                - -c
              args:
                - |
                  BLOCKLIST_PATH="/blocklist/hosts"
                  TEMP_RAW_FILE="/tmp/blocklist.raw"
                  TEMP_HOSTS_FILE="/tmp/hosts.tmp"
                  BLOCKLIST_URL="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt"
                  echo "Attempting to download blocklist from $BLOCKLIST_URL"
                  curl -fsSL "$BLOCKLIST_URL" -o "$TEMP_RAW_FILE"
                  if [ -s "$TEMP_RAW_FILE" ]; then
                    grep '^\*\.' "$TEMP_RAW_FILE" | sed 's/^\*\./0.0.0.0 /' > "$TEMP_HOSTS_FILE"
                    rm -f "$TEMP_RAW_FILE"
                    if ! cmp -s "$TEMP_HOSTS_FILE" "$BLOCKLIST_PATH"; then
                        echo "New blocklist downloaded, updating..."
                        mv "$TEMP_HOSTS_FILE" "$BLOCKLIST_PATH"
                        echo "Blocklist updated at $BLOCKLIST_PATH."
                    else
                        echo "Blocklist is already up-to-date."
                        rm "$TEMP_HOSTS_FILE"
                    fi
                  else
                    echo "Failed to download or downloaded an empty blocklist. No changes made."
                    if [ -f "$TEMP_HOSTS_FILE" ]; then
                        rm "$TEMP_HOSTS_FILE"
                    fi
                  fi
              volumeMounts:
                - name: blocklist-storage
                  mountPath: /blocklist
