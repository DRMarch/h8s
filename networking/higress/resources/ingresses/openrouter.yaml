apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openrouter
  namespace: higress-system
  annotations:
    higress.io/backend-protocol: HTTPS
    higress.io/destination: openrouter.dns
    higress.io/proxy-ssl-name: openrouter.ai
    higress.io/proxy-ssl-server-name: "on"
    higress.io/exact-match-header-x-higress-llm-provider: or
spec:
  ingressClassName: higress
  rules:
    - host: llm.drmarchent.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
    - host: higress-internal.higress-system.svc.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
