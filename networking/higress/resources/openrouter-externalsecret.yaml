apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: higress-openrouter
  namespace: higress-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: higress-openrouter
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: higress/openrouter
        property: api-key
