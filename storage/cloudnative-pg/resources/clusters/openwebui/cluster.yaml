apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-openwebui
  namespace: open-webui
spec:
  description: Postgres cluster for Open WebUI
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 1
  storage:
    size: 1Gi
  managed:
    roles:
      - name: openwebui
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-openwebui-user-credentials
          key: password
  enableSuperuserAccess: false
